# version: '3.8'
services:
  odoo:
    image: odoo:18.0
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - odoo-data:/var/lib/odoo
      - ./custom-addons:/mnt/extra-addons
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5444:5432"   # thêm dòng này để mở port db ra ngoài

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8070:80"  # Nginx lắng nghe cổng 8069 bên ngoài
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - odoo

volumes:
  odoo-data:
  db-data:

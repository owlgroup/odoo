server {
    listen 80;
    server_name 103.82.38.96;

    # Serve Angular frontend
    root /var/www/angular/dist;
    index index.html;
    
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy Odoo backend
    location /api/ {
        proxy_pass http://localhost:8069/;  # hoặc http://odoo:8069 nếu dùng Docker internal
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;

        proxy_cookie_path / /;  # giữ cookie nguyên vẹn
    }

    # Optional CORS handling (nếu Angular và Odoo vẫn ở 2 port riêng biệt)
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Accept, Set-Cookie, Cookie' always;

    # Handle OPTIONS preflight
    if ($request_method = OPTIONS) {
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }
}
